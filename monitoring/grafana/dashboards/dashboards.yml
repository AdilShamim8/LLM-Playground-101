# Grafana dashboard provisioning configuration.
#
# This tells Grafana to automatically load dashboards from the
# monitoring/grafana/dashboards/ directory without manual import.

apiVersion: 1

providers:
  - name: "LLM Playground Dashboards"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
