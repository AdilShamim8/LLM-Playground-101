# ═══════════════════════════════════════════════════════════════════════
#  docker-compose.prod.yml — Production deployment configuration
# ═══════════════════════════════════════════════════════════════════════
#
#  This file extends docker-compose.yml with production settings:
#  - Resource limits (CPU/memory)
#  - Multiple API workers
#  - Restart policies
#  - Logging drivers with rotation
#  - No port exposure (use reverse proxy)
#
#  Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#

version: "3.9"

services:
  api:
    deploy:
      replicas: 2              # Run 2 API instances behind nginx
      resources:
        limits:
          cpus: "4"
          memory: 16G
        reservations:
          cpus: "2"
          memory: 8G
      restart_policy:
        condition: on-failure
        max_attempts: 3
        window: 120s
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --loop uvloop
      --timeout-keepalive 30
    environment:
      - ENVIRONMENT=production
      - DEV_MODE=false
      - LOG_LEVEL=INFO
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    ports: !reset []           # No direct port exposure; use nginx

  ui:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports: !reset []

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: always
    networks:
      - llm_net

  redis:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  postgres:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
