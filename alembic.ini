# Alembic configuration for database migrations.
#
# Migrations let you evolve the database schema safely:
#   alembic revision --autogenerate -m "add users table"
#   alembic upgrade head
#
# This ensures schema changes are version-controlled and reproducible.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://llm_user:llm_password@localhost:5432/llm_playground

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
