# ═══════════════════════════════════════════════════════════════════════
#  ci.yml — Continuous Integration Pipeline
# ═══════════════════════════════════════════════════════════════════════
#
#  This workflow runs on every push and pull request to main.
#  It performs:
#    1. Linting (ruff check + ruff format --check) — FAILS the build on issues
#    2. Type checking (mypy) — warnings only, doesn't fail
#    3. Tests (pytest) — runs core tests (models, generation, training)
#
#  Design decisions:
#  - Lint is a HARD GATE. If ruff fails, the build fails. No exceptions.
#  - Tests only run the core suite (test_models, test_generation,
#    test_training) that don't need heavy optional dependencies like
#    trafilatura, flash-attn, or deepspeed. test_data.py requires
#    trafilatura (web scraping lib) which is hard to install in CI.
#  - PyTorch is installed CPU-only (much smaller: 200MB vs 2GB for CUDA).
#  - mypy runs but is non-blocking (continue-on-error) until the codebase
#    is fully typed.
#

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─── Lint (Ruff) — HARD GATE ───────────────────────────────────────────
  # If this fails, the build fails. No exceptions.
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.1.13

      - name: Run ruff check (lint rules)
        run: ruff check .

      - name: Run ruff format check (formatting)
        run: ruff format --check .

  # ─── Type Check (MyPy) — non-blocking ──────────────────────────────────
  type-check:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy==1.7.1

      - name: Run mypy (non-blocking)
        run: mypy .
        continue-on-error: true

  # ─── Tests — core suite only ───────────────────────────────────────────
  # We run only test_models.py, test_generation.py, and test_training.py.
  # test_data.py requires trafilatura (a heavy C-extension web scraping
  # library) that is hard to install in CI and isn't core to the ML pipeline.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        # Install numpy FIRST (before torch) because torch 2.1.0 needs
        # numpy < 2.0. If numpy 2.x is installed, torch fails with
        # "Numpy is not available" at runtime.
        # We pin numpy<2.0 for torch 2.1.0 compatibility.
        run: |
          pip install --upgrade pip
          pip install "numpy<2.0"
          # CPU-only PyTorch: ~200MB vs ~2GB for CUDA version
          pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov pytest-asyncio pyyaml loguru

      - name: Install package
        run: pip install -e . --no-deps

      - name: Run core tests
        # Only run tests that don't need optional heavy dependencies.
        # test_data.py needs trafilatura; skip it in CI.
        run: pytest tests/test_models.py tests/test_generation.py tests/test_training.py -v --tb=short
