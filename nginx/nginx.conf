# ═══════════════════════════════════════════════════════════════════════
#  nginx.conf — Reverse proxy for LLM Playground production
# ═══════════════════════════════════════════════════════════════════════
#
#  This config provides:
#  - Load balancing across multiple API instances
#  - SSL/TLS termination (add certs in production)
#  - Security headers
#  - Request size limits (protect against DoS)
#  - Gzip compression for faster responses
#  - WebSocket/SSE support for streaming chat
#  - Rate limiting at the proxy level
#

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50m;     # Max request size (protects against DoS)
    client_body_buffer_size 1m;

    # ── Gzip Compression ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Rate Limiting ─────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/s;

    # ── Upstream: API servers (load balanced) ────────────────────────
    upstream api_backend {
        least_conn;                   # Route to least-busy server
        server api:8000 max_fails=3 fail_timeout=30s;
        # Add more servers for horizontal scaling:
        # server api2:8000 max_fails=3 fail_timeout=30s;
    }

    upstream ui_backend {
        server ui:7860;
    }

    # ── HTTP → HTTPS redirect (enable in production with TLS) ────────
    server {
        listen 80;
        server_name _;

        # In production, redirect HTTP to HTTPS:
        # return 301 https://$host$request_uri;

        # For development without TLS:
        location / {
            proxy_pass http://ui_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ── Security headers ──────────────────────────────────────
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # ── Chat endpoint: SSE/WebSocket streaming support ─────────────
        location /api/v1/chat/completions {
            limit_req zone=chat_limit burst=10 nodelay;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE: disable buffering, long timeout for streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # WebSocket support (if needed in future)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Health check endpoint (no rate limit) ─────────────────────
        location /health {
            proxy_pass http://api_backend;
            access_log off;
        }

        # ── API docs ──────────────────────────────────────────────────
        location /docs {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }
    }
}
